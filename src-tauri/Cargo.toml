[package]
name = "lyryc"
version = "0.1.0"
description = "A music lyrics synchronization desktop app"
authors = ["cato"]
edition = "2021"

[lib]
name = "lyryc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-util = "0.7"
anyhow = "1"
regex = "1"
urlencoding = "2"
tokio-tungstenite = "0.20"
tungstenite = "0.20"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }
lazy_static = "1.4"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"
autoruby = { version = "0.5.1", features = ["integrated"] }
base64 = "0.22"
flate2 = "1"
# Pre-alignment (opt-in word timing for YouTube Music): ONNX Runtime on the CPU
# (onnxruntime.dll is fetched on enable, not linked), AAC-in-MP4 decoding,
# pinyin, and the UniDic tokenizer autoruby already ships.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
pinyin = { version = "0.10", default-features = false, features = ["plain"] }
lindera-tokenizer = { version = "0.24", features = ["unidic"] }
lindera-dictionary = "0.24"
lindera-core = "0.24"
sha2 = "0.10"
num_cpus = "1"
unicode-normalization = "0.1"

[dev-dependencies]
csv = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
