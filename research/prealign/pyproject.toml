[project]
name = "lyryc-prealign-research"
version = "0.1.0"
description = "Pre-align lyrics for YouTube Music tracks before they play (Lyryc research)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy<2.3",
    "soundfile>=0.12",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "transformers>=4.45,<5",
    "uroman>=1.3",
    "pykakasi>=2.3.0",
    "psutil>=5.9",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "ytmusicapi>=1.8",
    "yt-dlp[default]>=2025.1.1",
    "demucs>=4.0.1",
    "pycryptodome>=3.20",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
